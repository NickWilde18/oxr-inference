# 构建镜像，推到运行这个 workflow 的仓库对应的 GHCR（ghcr.io/<所有者>/<仓库名>，fork 里就是 fork 主人自己的）。
# 只为 v* 标签构建：推标签时自动跑，也可以在某个 v* 标签上手动触发（发版构建失败、要换权重来源时重跑）。镜像标签是
# 版本号和 latest（latest 跟着最新的正式版本；在旧标签上重跑会把 latest 指回那个版本）。包第一次推送
# 时默认私有，公开与否在 GitHub 上设；镜像里有 NVIDIA CUTLASS DSL 的二进制库，许可见 THIRD_PARTY_NOTICES.md。构建缓存
# 放在单独的包 <仓库名>-cache，镜像包里只有版本号和 latest。
#
# GitHub 托管的构建机只保证 14 GB 磁盘，镜像里光 torch 和 CUDA 库加权重就有好几 GB，构建前先删掉构建机预装、这里用不到
# 的大件。
name: Image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      weights_base_url:
        description: Weights download base URL. Leave empty for the default (ModelScope); if ModelScope is unreachable, use https://huggingface.co/SoMarkAI/OXR-1.0/resolve/main/
        type: string
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Image tags
        id: tags
        run: |
          if [ "${GITHUB_REF_TYPE}" != tag ] || [[ "${GITHUB_REF_NAME}" != v* ]]; then
            echo "::error::This workflow only builds v* tags; got ${GITHUB_REF_TYPE} ${GITHUB_REF_NAME}"
            exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY,,}"  # GHCR 的名字要小写
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "tags=${image}:${GITHUB_REF_NAME},${image}:latest" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            WEIGHTS_BASE_URL=${{ inputs.weights_base_url }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0 AND LicenseRef-OXR
          provenance: false
          # mode=max 连中间层（下载权重那一阶段）一起存。没改到的层直接复用，推出去的镜像和上一版共用这些层，
          # 节点升级时只拉变了的几层。fork 里还没有缓存时只是读不到，构建照常。
          cache-from: type=registry,ref=${{ steps.tags.outputs.image }}-cache:buildcache
          cache-to: type=registry,ref=${{ steps.tags.outputs.image }}-cache:buildcache,mode=max
