# 把 latest 指到一个已经推上去的标签（比如 v1.0.0），只改标签、不重新构建，latest 和那个版本是同一个镜像。
# 推 v* 标签的构建已经会打 latest；这个流程用于把 latest 指回别的版本（比如在旧标签上重跑过构建之后）。
name: Promote

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing image tag to point latest at, e.g. v1.0.0
        required: true
        type: string

permissions:
  packages: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Point latest at the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx imagetools create --tag "${image}:latest" "${image}:${TAG}"
          docker buildx imagetools inspect "${image}:latest" | head -3
